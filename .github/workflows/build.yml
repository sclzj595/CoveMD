# CoveMD 多平台 VSIX 构建与发布
#
# 设计要点：
# - 原生模块 covemd_native.node 必须在目标平台原生编译（MSVC/clang/gcc），
#   由矩阵把 5 个 target 分发到对应 runner，无交叉编译。
# - macOS：darwin-arm64 直接原生构建；darwin-x64 若用 macos-13（Intel）免费槽位
#   排队可达数小时，故改在 arm64 runner 上交叉编译（cmake-js --arch → CMAKE_OSX_ARCHITECTURES），
#   并用 file 命令断言产物架构，防止静默错架构。
# - linux-arm64 用 GitHub 免费 arm64 runner（仓库为 public 才可用）。
# - 每个 job 产物以 artifact 上传；打 v* tag 时额外创建 GitHub Release 并附全部 VSIX。
#
# 注意：Windows 上必须走 MSVC 工具链（runner 默认即 VS2022），
#       MinGW 构建的 .node 在 Electron 宿主会段错误（项目已验证的教训）。

name: Build VSIX

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   target: win32-x64 }
          - { os: macos-latest,     target: darwin-x64, cross: x86_64 }
          - { os: macos-latest,     target: darwin-arm64 }
          - { os: ubuntu-latest,    target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build native module (binding/)
        shell: bash
        working-directory: binding
        run: |
          npm ci --no-audit --no-fund
          if [ -n "${{ matrix.cross }}" ]; then
            # 交叉编译（arm64 runner 上产出 x86_64 .node，规避 macos-13 排队）
            npx cmake-js compile --out build --arch ${{ matrix.cross }}
            file build/Release/covemd_native.node
            file build/Release/covemd_native.node | grep -q x86_64 || {
              echo "::error::cross-compile failed: expected x86_64 binary"; exit 1; }
          else
            npx cmake-js compile --out build
            npm test
          fi

      - name: Package VSIX (extension/)
        shell: bash
        working-directory: extension
        run: |
          npm ci --no-audit --no-fund
          npm run compile
          # 交叉编译 job 的 .node 无法被本机 node 加载（架构不同），
          # native 冒烟由其余原生矩阵 job 覆盖，这里只跳过测试、照常打包
          if [ -z "${{ matrix.cross }}" ]; then
            npm test
          fi
          mkdir -p native
          cp ../binding/build/Release/covemd_native.node native/covemd_native.node
          VERSION=$(node -p "require('./package.json').version")
          npx -y @vscode/vsce package --no-dependencies \
            --target ${{ matrix.target }} \
            -o "covemd-$VERSION-${{ matrix.target }}.vsix"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: extension/*.vsix
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release create 依赖 git 上下文解析仓库，必须先 checkout
      - uses: actions/checkout@v4

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: dist

      - name: Create release with VSIX assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist/
          gh release create "$GITHUB_REF_NAME" dist/*.vsix \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      # 上架 Open VSX 开源插件市场（namespace sclzj595，需先在仓库 secret 配 OVSX_TOKEN）
      # 5 个平台 VSIX 各自带 TargetPlatform 元数据（vsce package --target 打入），
      # 逐个顺序发布后 Open VSX 自动合并为一个 listing，按客户端平台分发
      - name: Publish to Open VSX
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          if [ -z "$OVSX_TOKEN" ]; then
            echo "::warning::OVSX_TOKEN secret 未配置，跳过 Open VSX 上架"
            exit 0
          fi
          for f in dist/*.vsix; do
            echo "Publishing $f ..."
            npx -y ovsx publish "$f" --pat "$OVSX_TOKEN" --skip-duplicate
          done
